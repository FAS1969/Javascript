    <style>
      html,
      body {
        font-family: sans-serif;
        font-size: 1.1em;
        margin: 0;
        --main-spacing: 15px 5px 10px 5px;
        --header-footer-spacing: 10px 5px;
      }

      #app {
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas: 'header' 'main' 'footer';
      }

      #app > header,
      #app > footer {
        padding: var(--header-footer-spacing);
        background-color: lightblue;
      }

      #app > header {
        grid-area: header;
      }

      #app > header a {
        margin-right: 20px;
        cursor: pointer;
      }

      #app > header a.disabled {
        cursor: default;
        opacity: 0.5;
      }

      #app > main {
        grid-area: main;
        padding: var(--main-spacing);
        overflow: auto;
        display: grid;
        grid-template-rows: 200px 1fr;
        grid-template-columns: 1fr minmax(0, 600px) 1fr;
      }

      #app > main > section {
        grid-area: 1 / 2 / 1 / 3;
        margin-bottom: 5px;
      }

      #app > main > section.full {
        grid-area: 1 / 1 / 0 / 2;
      }

      #app > footer {
        grid-area: footer;
      }

      table th {
        text-align: left;
      }

      table th,
      table td {
        padding: 5px;
      }

      input {
        display: block;
        height: 25px;
        width: calc(100% - 6px);
        border: 1px solid gray;
        padding: 3px;
        border-radius: 5px;
      }

      button {
        background-color: lightskyblue;
        border: 1px solid lightskyblue;
        border-radius: 5px;
        font-size: 15px;
        padding: 5px 10px;
      }

    .contact-link {
      background-image: linear-gradient(to bottom, #ff9600, #cc7800);
      border-radius: 3px 3px 0 0;
      color: #fff;
      float: left;
      font-size: 15px;
      display: block;
      height: 40px;
      width: 200px;
      line-height: 40px;
      padding: 0 10px;
      pointer-events: auto;
      text-decoration: none;
      transform: rotate(90deg);

    .contact-text {

/****************Лупа**********************/
.magnifying-glass {
    position: relative;
    padding-top: 0px;
    padding-left: 2px;
    font-size: 24px;
    font-weight: 800;
    width: 25px;
    height: 25px;

    box-sizing: border-box;
    background-color: aliceblue;

    border: 5px solid slategray;
    border-radius: 50%;
}

.magnifying-glass:after {
  content: "";
  position: absolute;
  bottom: 0;
  right: 0;

  width: 20px;
  height: 6px;
  background-color: slategray;

  border-radius: 0 7.5px 7.5px 0;

  transform-origin: 0 50%;
  transform: translateX(100%) rotate(45deg);
}
.d24 {
  background: slategray;
  top: -2px;
  height: 20px;
  width: 3px;
  position: relative;
  left: 4px;
}
.d24:after {
  content: "";
  height: 2px;
  width: 20px;
  background: slategray;
  position: absolute;
  left: -8px;
  top: 8px;
}
.magnifying-glass1 {
font-size: 3em; /* задает размер иконки */
width: 0.3em;
height: 0.3em;
margin-bottom: 20px;
border: 0.1em solid #52C8E4;
position: relative;
border-radius: 50%;
}
.magnifying-glass1:before {
content: "";
width: 0.3em;
height: 0.08em;
position: absolute;
right: -0.25em;
bottom: -0.1em;
background: #52C8E4;
transform: rotate(45deg);
}
.zoomLupa {
  position: relative;
  left: -50px;
  top: -20px;
}
#check2 {

  display: inline-block;
vertical-align: middle;
}
form {
  width: 200px;
margin-left: 20px;
margin-right: 20px;
}
