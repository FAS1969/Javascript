<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Etalon html5</title>
    <meta charset="utf-8" />
    <meta name="description" content="Description of web page" />
    <!--для поддержки мобильных устройств -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="https://dvere-erkado.cz/" target="_blank">
    <!--link rel="stylesheet" href="style.css" />
    <script-- src="script.js"></script-->
    <style>
      html,
      body {
        font-family: sans-serif;
        font-size: 1.1em;
        margin: 0;
        --main-spacing: 15px 5px 10px 5px;
        --header-footer-spacing: 10px 5px;
      }

      #app {
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas: 'header' 'main' 'footer';
      }

      #app > header,
      #app > footer {
        padding: var(--header-footer-spacing);
        background-color: lightblue;
      }

      #app > header {
        grid-area: header;
      }

      #app > header a {
        margin-right: 20px;
        cursor: pointer;
      }

      #app > header a.disabled {
        cursor: default;
        opacity: 0.5;
      }

      #app > main {
        grid-area: main;
        padding: var(--main-spacing);
        overflow: auto;
        display: grid;
        grid-template-rows: 200px 1fr;
        grid-template-columns: 1fr minmax(0, 600px) 1fr;
      }

      #app > main > section {
        grid-area: 1 / 2 / 1 / 3;
        margin-bottom: 5px;
      }

      #app > main > section.full {
        grid-area: 1 / 1 / 0 / 2;
      }

      #app > footer {
        grid-area: footer;
      }

    </style>
  </head>
  <body>
    <div id="app">
      <header>header</header>
      <main>
        <section className="full">
<img src="/image/cache/catalog/okna/sklopne/plastove-okno-50x50-sklopne-550x550.jpg"
  alt="Sklopné plastové okno 50x50 cm, Bílé, Sklopné" title="Sklopné plastové okno 50x50 cm, Bílé, Sklopné" width="550"
  height="550">
        </section>
      </main>
      <footer>footer</footer>
    </div>
  </body>
</html>
